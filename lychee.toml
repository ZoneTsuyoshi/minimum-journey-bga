# M2: リンク切れ（内部リンクのみ）。仕様書 004 第 2.2 節
# 実行: lychee --config lychee.toml "./**/*.md"（CI は lychee-action 経由）

# ネットワークに出ない。相対パスのファイル参照と # フラグメントのみ検査する
offline = true
include_fragments = "full"  # lychee 0.24 以降は文字列で指定
no_progress = true

# 検査対象にしない Markdown（正規表現）。data/ 配下へのリンク先の存在確認は引き続き行われる
exclude_path = ['^\.worktrees/', '^node_modules/', '^data/', '^vendor/']
